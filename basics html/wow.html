<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Table</title>
</head>
<body>

    <table id="studentTable" border="1">
        <thead>
            <tr>
                <th>Reg No</th>
                <th>Name</th>
                <th>Optional</th>
                <th>Average</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" name="regno"></td>
                <td><input type="text" name="name"></td>
                <td><input type="text" name="optional"></td>
                <td><input type="text" name="average"></td>
                <td><button onclick="removeRow(this)">Delete</button></td>
            </tr>
        </tbody>
    </table>

    <button onclick="addRow()">Add Row</button>

    <script>
        function addRow() {
            let table = document.getElementById("studentTable").getElementsByTagName('tbody')[0];
            let newRow = table.insertRow();

            for (let i = 0; i < 4; i++) {
                let cell = newRow.insertCell(i);
                let input = document.createElement("input");
                input.type = "text";
                cell.appendChild(input);
            }

            let actionCell = newRow.insertCell(4);
            let deleteBtn = document.createElement("button");
            deleteBtn.innerText = "Delete";
            deleteBtn.onclick = function () {
                removeRow(this);
            };
            actionCell.appendChild(deleteBtn);
        }

        function removeRow(button) {
            let row = button.parentNode.parentNode; // Get the parent <tr>
            row.parentNode.removeChild(row); // Remove the row
        }
    </script>

</body>
</html>
